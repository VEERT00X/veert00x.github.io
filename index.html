<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEERT00X</title>
</head>
<body>
    <p>Redirecting to VEERT00X.com</p>
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://veert00x.com/">
    </noscript>
    <script>
        const redirectUrl = "https://veert00x.com/";
        const path = window.location.pathname;
        if (path !== "/") {
            window.location.href =
                redirectUrl + path;
        } else {
            window.location.href = redirectUrl;
        }
    </script>
</body>
</html>
